<style>
:root{
  --primary:#069CBB;--primary-strong:#0b6c7d;--primary-soft:#dff3f6;--navy:#16303D;--navy-800:#122631;
  --ink:#0F172A;--ink-soft:#57636b;--hairline:#e4eaeb;--canvas:#fff;--canvas-soft:#f5f8f8;--yellow:#FFD200;
  --arch:linear-gradient(95deg,#CADA1F 0%,#7cc63f 42%,#069CBB 100%);
  --shadow-sm:0 1px 2px rgba(22,48,61,.07),0 1px 1px rgba(22,48,61,.04);
  --shadow-md:0 6px 16px -4px rgba(22,48,61,.12),0 2px 4px -1px rgba(22,48,61,.06);
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#cdd6d9;color:var(--ink);
  font-family:"Pretendard Variable",Pretendard,system-ui,sans-serif;letter-spacing:-.011em;word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--primary-strong);outline-offset:3px;border-radius:9999px}
.topline{position:fixed;top:0;left:0;right:0;height:4px;background:var(--arch);z-index:30}
/* 머리 */
.brand{position:fixed;top:20px;left:24px;z-index:20;display:flex;flex-direction:column;gap:10px;pointer-events:none}
.brand img{height:26px;width:auto;align-self:flex-start}
.brand .eyebrow{font-family:Poppins,sans-serif;font-weight:600;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--primary-strong)}
.brand h1{font-size:28px;font-weight:800;letter-spacing:-.025em;line-height:1.2;color:var(--ink)}
.brand p{font-size:14px;line-height:1.5;color:var(--ink-soft);max-width:26em}
/* 목록 */
.list{position:fixed;left:24px;top:232px;bottom:96px;width:268px;z-index:20;overflow:auto;padding:6px 8px 6px 0;scrollbar-width:thin}
.list h2{font-family:Poppins,sans-serif;font-weight:600;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);margin:14px 0 8px}
.list h2:first-child{margin-top:0}
.chip{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 12px 8px 8px;border-radius:9999px;
  font-size:14px;line-height:1.35;color:var(--ink);background:rgba(255,255,255,.62);border:1px solid rgba(228,234,235,.9);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);margin-bottom:6px;transition:background .3s,border-color .3s,transform .3s var(--ease)}
.chip:hover{background:#fff;border-color:var(--primary);transform:translateX(2px)}
.chip .n{flex:none;width:24px;height:24px;border-radius:9999px;display:grid;place-items:center;font-size:12px;font-weight:700;
  font-family:"Plus Jakarta Sans",Pretendard,sans-serif;background:var(--navy);color:#fff}
.chip[aria-current="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
@media (min-width:861px){
  body.focus .list{width:56px;overflow:hidden;transition:width .4s var(--ease)}
  body.focus .list:hover{width:268px;overflow:auto}
  body.focus .list h2{opacity:0}
  body.focus .list:hover h2{opacity:1}
  .list{transition:width .4s var(--ease)}
  body.focus .brand p{display:none}
}
.chip[aria-current="true"] .n{background:var(--yellow);color:var(--navy)}
/* 핫스팟 */
.hs{position:fixed;left:0;top:0;z-index:10;transform:translate(-50%,-50%);display:flex;align-items:center;gap:6px;pointer-events:auto;cursor:pointer;will-change:transform}
.hs .dot{width:26px;height:26px;border-radius:9999px;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;
  font-family:"Plus Jakarta Sans",Pretendard,sans-serif;box-shadow:0 0 0 3px rgba(255,255,255,.9),var(--shadow-md);position:relative}
.hs .dot::after{content:"";position:absolute;inset:-3px;border-radius:9999px;border:2px solid var(--yellow);opacity:0;animation:pulse 2.4s var(--ease) infinite}
.hs.on .dot{background:var(--yellow);color:var(--navy)}
.hs .lbl{font-size:13px;font-weight:600;background:rgba(255,255,255,.94);padding:5px 10px;border-radius:9999px;box-shadow:var(--shadow-sm);white-space:nowrap;opacity:0;transform:translateX(-4px);transition:opacity .25s,transform .25s var(--ease);pointer-events:none}
.hs:hover .lbl,.hs.on .lbl{opacity:1;transform:none}
@keyframes pulse{0%{opacity:.9;transform:scale(1)}70%{opacity:0;transform:scale(1.8)}100%{opacity:0}}
/* 카드 */
.card{position:fixed;right:24px;top:24px;bottom:96px;width:380px;z-index:25;background:var(--canvas);border:1px solid var(--hairline);border-radius:24px;
  box-shadow:var(--shadow-md);display:flex;flex-direction:column;overflow:hidden;transform:translateX(calc(100% + 40px));transition:transform .55s var(--ease)}
.card.open{transform:none}
.card .scroll{overflow:auto;padding:28px 28px 20px;flex:1}
.card .eyebrow{font-family:Poppins,Pretendard,sans-serif;font-weight:600;font-size:12px;letter-spacing:.12em;color:var(--primary-strong)}
.card h3{font-size:24px;font-weight:800;letter-spacing:-.025em;line-height:1.25;margin-top:12px}
.card .sub{font-size:14px;color:var(--ink-soft);margin-top:6px}
.card .desc{font-size:15px;line-height:1.625;margin-top:16px;text-wrap:pretty}
.card dl{margin-top:16px;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px;line-height:1.5}
.card dt{color:var(--ink-soft)}
.card figure{margin-top:20px}
.card figure img{width:100%;display:block;border-radius:16px;border:1px solid var(--hairline)}
.card figure.print img{background:repeating-conic-gradient(#f1f4f5 0 25%,#fff 0 50%) 0 0/18px 18px;padding:14px;max-height:300px;object-fit:contain}
.card figcaption{font-size:12px;line-height:1.5;color:var(--ink-soft);margin-top:8px}
.card .x{position:absolute;top:16px;right:16px;width:36px;height:36px;border-radius:9999px;display:grid;place-items:center;background:var(--canvas-soft);border:1px solid var(--hairline)}
.card .nav{display:flex;gap:8px;padding:14px 20px;border-top:1px solid var(--hairline);background:var(--canvas)}
.btn{height:44px;padding:0 20px;border-radius:9999px;font-size:15px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .3s var(--ease),background .3s,border-color .3s}
.btn:hover{transform:translateY(-2px)}
.btn-outline{background:#fff;border:1px solid var(--hairline)}
.btn-outline:hover{border-color:var(--primary);color:var(--primary-strong)}
.btn-arch{background:var(--arch);color:#fff;box-shadow:0 8px 18px -6px rgba(6,156,187,.34);flex:1;text-decoration:none}
.btn-navy{background:var(--navy);color:#fff}
.btn-navy:hover{background:var(--primary)}
/* 아래 막대 */
.bar{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:22;display:flex;gap:8px;padding:6px;border-radius:9999px;background:rgba(255,255,255,.78);
  border:1px solid rgba(228,234,235,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:var(--shadow-md)}
.bar .btn{height:40px;font-size:14px;padding:0 16px}
.bar .btn[aria-pressed="true"]{background:var(--navy);color:#fff}
.note{position:fixed;right:24px;bottom:30px;z-index:18;font-size:12px;line-height:1.5;color:var(--ink-soft);text-align:right;max-width:340px}
.note a{color:var(--primary-strong);text-decoration:none;font-weight:600}
.hint{position:fixed;left:50%;top:22px;transform:translateX(-50%);z-index:19;font-size:13px;color:var(--ink-soft);background:rgba(255,255,255,.8);padding:7px 14px;border-radius:9999px;transition:opacity .6s;white-space:nowrap}
/* 로딩 */
.loader{position:fixed;inset:0;z-index:50;background:var(--navy);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .8s var(--ease)}
.loader img{height:30px;filter:brightness(0) invert(1)}
.loader .t{font-size:15px;opacity:.8}
.loader .track{width:220px;height:4px;border-radius:9999px;background:rgba(255,255,255,.15);overflow:hidden}
.loader .fill{height:100%;width:0;background:var(--arch);transition:width .3s}
.loader.done{opacity:0;pointer-events:none}
/* 모바일 */
@media (max-width:860px){
  .brand{top:16px;left:16px;right:16px;gap:6px}
  .brand img{height:20px}
  .brand h1{font-size:22px}
  .brand p{display:none}
  .list{left:0;right:0;top:auto;bottom:76px;width:auto;height:auto;display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;padding:4px 16px;scroll-snap-type:x mandatory}
  .list h2{display:none}
  .chip{flex:none;width:auto;margin:0;scroll-snap-align:start;background:rgba(255,255,255,.9)}
  .card{left:8px;right:8px;top:auto;bottom:8px;width:auto;max-height:52vh;border-radius:24px 24px 20px 20px;transform:translateY(calc(100% + 24px))}
  .card .scroll{padding:22px 20px 14px}
  .card h3{font-size:22px}
  .bar{bottom:16px}
  .note{display:none}
  .hs .lbl{display:none}
  .hint{top:auto;bottom:128px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<header class="brand">

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import CameraControls from 'camera-controls';
CameraControls.install({ THREE });

const MOBILE = matchMedia('(max-width:860px)').matches || matchMedia('(pointer:coarse)').matches;
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const B = (a) => new THREE.Vector3(a[0], a[2], -a[1]);            // Blender(x,y,z) → three(x,z,-y)
const BG = 0xcdd6d9;

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, MOBILE ? 1.6 : 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.12;

const scene = new THREE.Scene();
scene.background = new THREE.Color(BG);
scene.fog = new THREE.Fog(BG, 260, 900);
const camera = new THREE.PerspectiveCamera(MOBILE ? 48 : 38, innerWidth / innerHeight, 0.3, 3000);

// 빛: 하늘 반사광 + 남서쪽 해(Blender 렌더와 같은 방향)
scene.add(new THREE.HemisphereLight(0xf3f7f9, 0xc9c4bb, 1.7));
const sun = new THREE.DirectionalLight(0xfff5e8, 2.5);
sun.position.set(-48, 86, 48); sun.castShadow = true;
sun.shadow.mapSize.set(MOBILE ? 2048 : 4096, MOBILE ? 2048 : 4096);
Object.assign(sun.shadow.camera, { left: -80, right: 80, top: 80, bottom: -80, near: 1, far: 300 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03;
scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(3000, 3000), new THREE.MeshStandardMaterial({ color: BG, roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.position.y = -1.415; ground.receiveShadow = true; scene.add(ground);

// 바닥 재질 무늬(인도 보도블록·아스팔트) — 캔버스로 만든다
function canvasTex(draw, size = 512) {
  const c = document.createElement('canvas'); c.width = c.height = size; draw(c.getContext('2d'), size);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8; return t;
}
const paverTex = canvasTex((g, s) => {
  g.fillStyle = '#bab6ae'; g.fillRect(0, 0, s, s);
  const bw = s / 2.5, bh = s / 5;                                   // 1m = 512px, 블록 0.4×0.2m
  for (let r = 0; r < 5; r++) for (let k = -1; k < 3; k++) {
    const x = k * bw + (r % 2 ? bw / 2 : 0), y = r * bh, v = 200 + ((r * 7 + k * 13) % 5) * 3;
    g.fillStyle = `rgb(${v + 6},${v + 2},${v - 6})`; g.fillRect(x + 2, y + 2, bw - 4, bh - 4);
  }
});
const asphaltTex = canvasTex((g, s) => {
  g.fillStyle = '#44484c'; g.fillRect(0, 0, s, s);
  for (let i = 0; i < 9000; i++) { const v = 55 + Math.random() * 40 | 0; g.fillStyle = `rgba(${v},${v + 2},${v + 4},.55)`; g.fillRect(Math.random() * s, Math.random() * s, 1.6, 1.6); }
});
asphaltTex.repeat.set(60, 42);

// 데이터·모형 불러오기
const fill = document.getElementById('fill');
const data = await (await fetch('data.json')).json();
const draco = new DRACOLoader().setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/libs/draco/gltf/');
const gltf = await new GLTFLoader().setDRACOLoader(draco).loadAsync('diorama.glb', (e) => { if (e.total) fill.style.width = (e.loaded / e.total * 100).toFixed(0) + '%'; });
const root = gltf.scene; scene.add(root);
const pickables = [];
root.traverse((o) => {
  if (!o.isMesh) return;
  const ms = Array.isArray(o.material) ? o.material : [o.material];
  const decal = ms.some((m) => /^P_|bollard_sleeve/.test(m.name));
  o.castShadow = !decal || /bollard/.test(o.name); o.receiveShadow = true;
  for (const m of ms) {
    if (m.map) m.map.anisotropy = 8;
    if (/^P_/.test(m.name)) { m.transparent = false; m.alphaTest = 0.45; m.polygonOffset = true; m.polygonOffsetFactor = -2; m.polygonOffsetUnits = -2; m.depthWrite = true; }
    if (m.name === 'paver') { m.map = paverTex; m.color.set(0xffffff); m.needsUpdate = true; }
    if (m.name === 'asphalt') { m.map = asphaltTex; m.color.set(0xffffff); m.needsUpdate = true; }
    if (/^plinth/.test(m.name)) { m.roughness = 0.45; m.polygonOffset = true; m.polygonOffsetFactor = 4; m.polygonOffsetUnits = 4; }
  }
  let p = o; while (p && !p.userData.pi_product) p = p.parent;
  if (p) { o.userData.spot = groupToSpot(p.userData.pi_product); if (o.userData.spot) pickables.push(o); }
});
// 아스팔트 UV는 판 전체 0..1 — 무늬 반복은 텍스처 repeat로
function groupToSpot(g) {
  if (!g) return null;
  if (/^foot_S/.test(g)) return 'foot2';
  if (/^foot_/.test(g)) return 'foot';
  const map = { bollards: 'bollard', c01: 'corner', c04: 'corner' };
  return map[g] || (data.spots.find((s) => s.id === g) ? g : null);
}

// 후처리: 주변 가림(AO) + 미니어처(틸트시프트)
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
let gtao = null;
if (!MOBILE) { try { gtao = new GTAOPass(scene, camera, innerWidth, innerHeight); gtao.blendIntensity = 0.85; composer.addPass(gtao); } catch (e) { console.warn(e); } }
const tilt = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, amount: { value: 0 }, res: { value: new THREE.Vector2(innerWidth, innerHeight) } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader: `uniform sampler2D tDiffuse; uniform float amount; uniform vec2 res; varying vec2 vUv;
    void main(){
      float d = smoothstep(0.10, 0.48, abs(vUv.y-0.52));
      float r = amount*d;
      vec4 acc=vec4(0.); float w=0.;
      for(int i=0;i<16;i++){ float a=float(i)*2.39996; float rr=sqrt(float(i)/16.); vec2 o=vec2(cos(a),sin(a))*rr*r/res;
        acc+=texture2D(tDiffuse,vUv+o); w+=1.; }
      vec4 col = acc/w;
      col.rgb = mix(col.rgb, col.rgb*1.06, d*0.4*step(0.01,amount)); // 미니어처 채도 살짝
      gl_FragColor=col; }`,
});
composer.addPass(tilt);
composer.addPass(new OutputPass());

// 카메라 조작
const controls = new CameraControls(camera, canvas);
controls.smoothTime = REDUCED ? 0 : 0.55;
controls.draggingSmoothTime = 0.12;
controls.minDistance = 1.2; controls.maxDistance = 240;
controls.maxPolarAngle = Math.PI * 0.485;
controls.setBoundary(new THREE.Box3(new THREE.Vector3(-62, -1, -46), new THREE.Vector3(62, 40, 46)));
controls.dollyToCursor = true;
const OV = MOBILE ? { pos: [-10, -96, 118], target: [-4, 4, -2] } : data.overview;
controls.setLookAt(...B([-160, -260, 200]).toArray(), ...B(OV.target).toArray(), false);

// 목록·핫스팟
const list = document.getElementById('list');
const groups = [['친환경그래픽노면표시재', '노면표시재'], ['친환경직물시트', '직물시트']];
const chips = {}, hsEls = {};
data.spots.forEach((s, i) => { s.n = i + 1; s.anchorV = B(s.anchor); });
for (const [mat, short] of groups) {
  const h = document.createElement('h2'); h.textContent = short; list.appendChild(h);
  for (const s of data.spots.filter((x) => x.mat.startsWith(mat))) {
    const b = document.createElement('button'); b.className = 'chip'; b.innerHTML = `<span class="n">${s.n}</span><span>${s.title}</span>`;
    b.onclick = () => { stopTour(); go(s.id); }; list.appendChild(b); chips[s.id] = b;
  }
}
for (const s of data.spots) {
  const el = document.createElement('div'); el.className = 'hs'; el.innerHTML = `<span class="dot">${s.n}</span><span class="lbl">${s.title}</span>`;
  el.onclick = () => { stopTour(); go(s.id); }; document.body.appendChild(el); hsEls[s.id] = el;
}

// 카드
const card = document.getElementById('card'), body = document.getElementById('cardBody');
let cur = -1;
function renderCard(s) {
  body.innerHTML = `
    <span class="eyebrow">${s.mat}</span>
    <h3>${s.title}</h3><p class="sub">${s.sub}</p>
    <p class="desc">${s.desc}</p>
    <dl><dt>소재</dt><dd>${s.mat}</dd><dt>크기</dt><dd>${s.size}</dd></dl>
    ${s.print ? `<figure class="print"><img src="${s.print}" alt="${s.title} 출력 원본 디자인" loading="lazy"><figcaption>출력 원본 디자인</figcaption></figure>` : ''}
    ${s.photo ? `<figure><img src="${s.photo}" alt="${s.title} 실제 시공 현장" loading="lazy"><figcaption>퍼블릭아이디 실제 시공 현장</figcaption></figure>` : ''}`;
  body.scrollTop = 0;
}
async function go(id) {
  const i = data.spots.findIndex((s) => s.id === id); if (i < 0) return;
  cur = i; const s = data.spots[i];
  for (const k in chips) chips[k].setAttribute('aria-current', k === id ? 'true' : 'false');
  for (const k in hsEls) hsEls[k].classList.toggle('on', k === id);
  chips[id].scrollIntoView({ block: 'nearest', inline: 'center', behavior: REDUCED ? 'auto' : 'smooth' });
  renderCard(s); card.classList.add('open'); hideHint(); document.body.classList.add('focus');
  const p = B(s.view.pos), t = B(s.view.target);
  frameOffset(p.distanceTo(t), true);
  const far = camera.position.distanceTo(p);
  controls.smoothTime = REDUCED ? 0 : (far > 40 ? 0.95 : 0.6);      // 멀수록 천천히 날아간다
  controls.setLookAt(p.x, p.y, p.z, t.x, t.y, t.z, true);
}
function frameOffset(d, card) {
  // 카드·목록이 가리는 쪽을 피해 제품을 남은 화면 가운데로(카메라 좌우·위아래 평행 이동)
  const h = 2 * d * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)), w = h * camera.aspect;
  let ox = 0, oy = 0;
  if (MOBILE) { if (card) oy = (Math.min(innerHeight * 0.52, 460) / 2) / innerHeight * h; }
  else ox = ((card ? 404 : 0) - (card ? 70 : 300)) / 2 / innerWidth * w;
  controls.setFocalOffset(ox, oy, 0, !REDUCED);
}
function overview() {
  cur = -1; card.classList.remove('open'); document.body.classList.remove('focus');
  frameOffset(B(OV.pos).distanceTo(B(OV.target)), false);
  for (const k in chips) chips[k].setAttribute('aria-current', 'false');
  for (const k in hsEls) hsEls[k].classList.remove('on');
  const p = B(OV.pos), t = B(OV.target); controls.setLookAt(p.x, p.y, p.z, t.x, t.y, t.z, true);
}
document.getElementById('close').onclick = () => { stopTour(); overview(); };
document.getElementById('prev').onclick = () => { stopTour(); go(data.spots[(cur - 1 + data.spots.length) % data.spots.length].id); };
document.getElementById('next').onclick = () => { stopTour(); go(data.spots[(cur + 1) % data.spots.length].id); };
document.getElementById('bOverview').onclick = () => { stopTour(); overview(); };

// 자동 둘러보기
let tourTimer = null; const bTour = document.getElementById('bTour');
function startTour() { bTour.setAttribute('aria-pressed', 'true'); bTour.textContent = '둘러보기 멈춤'; const step = () => { go(data.spots[(cur + 1) % data.spots.length].id); tourTimer = setTimeout(step, 7000); }; step(); }
function stopTour() { if (!tourTimer) return; clearTimeout(tourTimer); tourTimer = null; bTour.setAttribute('aria-pressed', 'false'); bTour.textContent = '자동 둘러보기'; }
bTour.onclick = () => (tourTimer ? stopTour() : startTour());
canvas.addEventListener('pointerdown', stopTour);

// 미니어처 효과
let mini = true; const bMini = document.getElementById('bMini');
bMini.onclick = () => { mini = !mini; bMini.setAttribute('aria-pressed', String(mini)); };

// 3D에서 제품 누르기
const ray = new THREE.Raycaster(); let downAt = null;
canvas.addEventListener('pointerdown', (e) => { downAt = [e.clientX, e.clientY]; });
canvas.addEventListener('pointerup', (e) => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 6) return;
  ray.setFromCamera(new THREE.Vector2(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1), camera);
  const hit = ray.intersectObjects(pickables, false)[0];
  if (hit) go(hit.object.userData.spot);
});
addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { stopTour(); overview(); }
  if (e.key === 'ArrowRight') document.getElementById('next').click();
  if (e.key === 'ArrowLeft') document.getElementById('prev').click();
});

// 안내 문구
const hint = document.getElementById('hint'); let hinted = false;
function hideHint() { if (hinted) return; hinted = true; hint.style.opacity = 0; }
canvas.addEventListener('pointerdown', hideHint, { once: true });

// 크기
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
  tilt.uniforms.res.value.set(innerWidth, innerHeight);
});

// 핫스팟 위치 갱신
const v = new THREE.Vector3(), camT = new THREE.Vector3();
function placeHotspots() {
  controls.getTarget(camT);
  const camDist = camera.position.distanceTo(camT);
  for (const s of data.spots) {
    const el = hsEls[s.id];
    v.copy(s.anchorV).project(camera);
    const d = camera.position.distanceTo(s.anchorV);
    const vis = v.z < 1 && Math.abs(v.x) < 1.05 && Math.abs(v.y) < 1.05 && d < Math.max(70, camDist * 1.6);
    el.style.display = vis ? 'flex' : 'none';
    if (vis) {
      el.style.transform = `translate(${(v.x * .5 + .5) * innerWidth}px,${(-v.y * .5 + .5) * innerHeight}px) translate(-13px,-13px)`;
      el.style.opacity = (cur >= 0 && data.spots[cur].id !== s.id && d < 12) ? 0.35 : 1;
    }
  }
}

// 시작: 먼 하늘에서 내려앉기
const clock = new THREE.Clock();
function loop() {
  const dt = clock.getDelta();
  controls.update(dt);
  controls.getTarget(camT);
  const dist = camera.position.distanceTo(camT);
  const want = mini ? THREE.MathUtils.smoothstep(dist, 22, 110) * (MOBILE ? 5 : 7) : 0;
  tilt.uniforms.amount.value += (want - tilt.uniforms.amount.value) * Math.min(1, dt * 4);
  placeHotspots();
  composer.render(dt);
  requestAnimationFrame(loop);
}
loop();
setTimeout(() => {
  document.getElementById('loader').classList.add('done');
  const p = B(OV.pos), t = B(OV.target);
  controls.smoothTime = REDUCED ? 0 : 1.4;
  frameOffset(p.distanceTo(t), false);
  controls.setLookAt(p.x, p.y, p.z, t.x, t.y, t.z, true).then(() => { controls.smoothTime = REDUCED ? 0 : 0.55; });
}, 250);
</script>
</body>
</html>
