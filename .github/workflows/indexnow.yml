# Vercel 프로덕션 배포가 성공하면, 직전 성공 배포 커밋과의 diff로 바뀐 공개 페이지만 IndexNow에 제출한다.
# 로직 = scripts/indexnow.mjs. 별도 비밀값 없음(IndexNow 키는 공개 설계, GitHub API는 기본 GITHUB_TOKEN만 사용).
name: IndexNow

on:
  deployment_status:

permissions:
  contents: read
  deployments: read

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  submit:
    if: >-
      github.event.deployment_status.state == 'success' &&
      startsWith(github.event.deployment.environment, 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.deployment.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # 같은 환경의 이전 배포 중 상태가 success인 가장 최근 것의 커밋 = diff 기준
      - name: 직전 성공 배포 커밋 찾기
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ENVIRONMENT: ${{ github.event.deployment.environment }}
          CURRENT_ID: ${{ github.event.deployment.id }}
        run: |
          base=""
          for row in $(gh api -X GET "repos/$REPO/deployments" -f environment="$ENVIRONMENT" -f per_page=30 \
                        --jq ".[] | select(.id < $CURRENT_ID) | \"\(.id):\(.sha)\""); do
            state=$(gh api "repos/$REPO/deployments/${row%%:*}/statuses?per_page=1" --jq '.[0].state // ""')
            if [ "$state" = "success" ]; then base="${row#*:}"; break; fi
          done
          if [ -n "$base" ] && ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "기준 커밋 $base 가 저장소에 없음 — 최근 7일 방식으로 대체"; base=""
          fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"
          echo "base=${base:-(없음)} head=${{ github.event.deployment.sha }}"

      - name: IndexNow 제출
        env:
          BASE: ${{ steps.base.outputs.sha }}
          HEAD_SHA: ${{ github.event.deployment.sha }}
        run: |
          if [ -n "$BASE" ]; then
            node scripts/indexnow.mjs --base "$BASE" --head "$HEAD_SHA"
          else
            node scripts/indexnow.mjs
          fi
